const dlFile = (content, name, mime='text/plain;charset=utf-8') => {
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([content], {type: mime})),
    download: name,
  });
  a.click(); URL.revokeObjectURL(a.href);
};

const safeFilename = s => (s||'전자책초안').replace(/[\\/:"*?<>|]/g,'_').slice(0,40);

const clipCopy = text => {
  if(navigator.clipboard?.writeText) return navigator.clipboard.writeText(text);
  return new Promise(res => {
    const ta = Object.assign(document.createElement('textarea'), {value: text, style:'position:fixed;opacity:0'});
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); res();
  });
};

const buildMarkdown = (titleData, toc, styleData, coverData, mindMap) => {
  const lines = [];
  const title = titleData?.final || '(제목 미정)';
  lines.push(`# ${title}`);
  if(titleData?.sub) lines.push(`\n> ${titleData.sub}\n`);
  lines.push('');
  if(coverData?.author) lines.push(`- **저자:** ${coverData.author}`);
  if(styleData?.cat)    lines.push(`- **카테고리:** ${styleData.cat}`);
  const sname = WRITING_STYLES.find(s=>s.id===styleData?.style)?.name;
  if(sname) lines.push(`- **문체:** ${sname}`);
  lines.push('\n---\n\n## 📋 목차\n');
  (toc||[]).forEach((ch, ci) => {
    lines.push(`### 제${ci+1}장. ${ch.title}\n`);
    (ch.sections||[]).forEach((s, si) => {
      lines.push(`- **${ci+1}.${si+1}** ${s.title}`);
      (s.subs||[]).forEach((sub, ki) => lines.push(`  - ${ci+1}.${si+1}.${ki+1} ${sub.title}`));
    });
    lines.push('');
  });
  if(mindMap?.children?.length) {
    lines.push('\n---\n\n## 🗺️ 마인드맵\n');
    lines.push(`**중심 주제:** ${mindMap.text}\n`);
    mindMap.children.forEach(n => {
      lines.push(`- ${n.text}${n.children.length ? ` (${n.children.map(c=>c.text).join(', ')})` : ''}`);
    });
  }
  if(coverData?.intro) { lines.push('\n---\n\n## 💬 표지 소개글\n'); lines.push(coverData.intro); }
  if(coverData?.prompt) { lines.push('\n---\n\n## 🖼️ AI 이미지 프롬프트\n\n```'); lines.push(coverData.prompt); lines.push('```'); }
  return lines.join('\n');
};

const buildSummaryHTML = (titleData, toc, styleData, coverData, mindMap) => {

${coverData?.intro||coverData?.prompt?`.prompt{background:#f8f8fe;border:1px solid #e0e7ff;border-radius:8px;padding:16px;font-size:13px;color:#555;white-space:pre-wrap;line-height:1.7}`:''}

let _nid = 1;
const mkNode = (text,level=0,parentId=null,colorIdx=0) => ({
  id:`n${_nid++}`, text, level, parentId, children:[],
  color: level===0 ? LEVEL_COLORS[0] : (LEVEL_COLORS[Math.min(level,2)] instanceof Array ? LEVEL_COLORS[Math.min(level,2)][colorIdx%8] : LEVEL_COLORS[0])

function BrainStormStep({data, onChange, onExtract}) {
  const [vals, setVals] = useState(data?.vals || {good:'', like:'', interest:''});
  const [topics, setTopics] = useState(data?.topics || []);
  const [selTopics, setSelTopics] = useState(data?.selTopics || []);
  const [loading, setLoading] = useState(false);
  const [extracted, setExtracted] = useState(data?.topics?.length > 0);

  useEffect(()=>onChange({vals, topics, selTopics}), [vals, topics, selTopics]);

  const set = (id, v) => setVals(p=>({...p,[id]:v}));
  const filled = Object.values(vals).some(v=>v.trim().length > 0);

  const extract = () => {
    setLoading(true);
    setTimeout(()=>{
      // 입력값에서 키워드 추출 (실제 AI 연동 시 Claude API 호출 위치)
      const all = Object.values(vals).join(' ');
      const keywords = [];
      // 직업/경험 관련
      if(/영업|마케팅|기획|디자인|개발|코딩|회계|세무|법률|의료|교육|강의|글쓰기|번역/.test(all)) keywords.push('직무 전문성 노하우');
      if(/다이어트|운동|헬스|요가|건강|식단|체중/.test(all)) keywords.push('건강 & 다이어트');
      if(/재테크|투자|주식|부동산|저축|돈|수익/.test(all)) keywords.push('재테크 & 투자');
      if(/여행|해외|국내여행|여행기|숙소|항공/.test(all)) keywords.push('여행 가이드');
      if(/요리|레시피|음식|먹방|쿠킹|식재료/.test(all)) keywords.push('요리 & 레시피');
      if(/육아|아이|자녀|교육|공부|학습|엄마|아빠/.test(all)) keywords.push('육아 & 자녀교육');
      if(/AI|ChatGPT|디지털|자동화|업무효율|도구|앱/.test(all)) keywords.push('AI & 디지털 도구 활용');
      if(/부업|N잡|프리랜서|부수입|온라인수익|블로그|유튜브/.test(all)) keywords.push('부업 & 수익화');
      if(/글쓰기|책|독서|콘텐츠|작가|블로그/.test(all)) keywords.push('글쓰기 & 콘텐츠 제작');
      if(/심리|감정|힐링|멘탈|스트레스|마음|자존감/.test(all)) keywords.push('심리 & 자기이해');
      if(/패션|뷰티|코디|스킨케어|메이크업/.test(all)) keywords.push('패션 & 뷰티');
      if(/공부|시험|자격증|취업|이직|커리어/.test(all)) keywords.push('커리어 & 자기계발');

      // 기본 추천 (키워드 없을 때)
      if (keywords.length < 3) {
        const defaults = ['나만의 경험담','생활 속 꿀팁 모음','초보자를 위한 입문 가이드','○○로 인생 바꾼 이야기'];
        defaults.forEach(d=>{ if(!keywords.includes(d)) keywords.push(d); });
      }

      // 직접 언급된 단어 추출
      const words = all.match(/[가-힣]{2,6}/g) || [];
      const freq = {};
      words.forEach(w=>{ if(w.length>=2) freq[w]=(freq[w]||0)+1; });
      const topWords = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([w])=>w+'에 대한 이야기');

      const result = [...new Set([...keywords, ...topWords])].slice(0, 10);
      setTopics(result);
      setExtracted(true);
      setLoading(false);
    }, 1000);
  };

  const toggleTopic = t => {
    setSelTopics(prev => prev.includes(t) ? prev.filter(x=>x!==t) : [...prev, t]);
  };

  return html`<div class="space-y-4">
    <!-- 헤더 -->
    <div class="card" style="background:linear-gradient(135deg,#f0f4ff,#faf5ff);border:1px solid #e0e7ff">
      <div class="flex items-start justify-between">
        <div>
          <div class="flex items-center gap-3 mb-1">
            <span class="text-3xl">💡</span>
            <h2 class="text-2xl font-black text-gray-800">아이디어 브레인스토밍</h2>
          </div>
          <p class="text-base font-semibold text-indigo-600 ml-12">나만의 책 주제 찾기</p>
          <p class="text-sm text-gray-500 mt-2 ml-12">솔직하게 생각나는 대로 적어보세요. 정답은 없습니다 😊</p>
        </div>
        <div class="w-14 h-14 bg-blue-500 rounded-full flex items-center justify-center flex-shrink-0 shadow-lg">
          <span class="text-white text-2xl">🔍</span>
        </div>
      </div>
    </div>

    <!-- 3가지 섹션 -->
    <div class="space-y-4">
      ${BS_SECTIONS.map(sec=>html`
        <div key=${sec.id} class="card" style=${{borderLeft:`4px solid ${sec.color}`}}>
          <div class="flex items-center gap-2 mb-1">
            <span class="text-xl font-black" style=${{color:sec.color}}>${sec.num}</span>
            <span class="text-lg">${sec.icon}</span>
            <h3 class="text-lg font-bold text-gray-800">${sec.title}</h3>
          </div>
          <p class="text-sm text-gray-500 mb-3 pl-8 leading-relaxed">${sec.hint}</p>
          <textarea
            value=${vals[sec.id]}
            onInput=${e=>set(sec.id, e.target.value)}
            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 resize-none"
            style="min-height:90px;line-height:1.8"
            placeholder=${sec.ph}
          ></textarea>
          <!-- 글자 힌트 태그 -->
          <div class="mt-2 flex flex-wrap gap-1">
            ${(sec.id==='good'
              ? ['칭찬받은 경험','자주 받는 질문','직장 경험','극복 스토리','특기']
              : sec.id==='like'
              ? ['취미 활동','주말에 하는 것','행복한 순간','빠져드는 것','설레는 것']
              : ['배우고 싶은 것','자주 검색하는 것','관심 분야','요즘 꽂힌 것','미래 목표']
            ).map(tag=>html`
              <span key=${tag}
                class="tag bg-gray-100 text-gray-500 hover:bg-indigo-100 hover:text-indigo-600 text-xs"
                style="font-size:11px"
                onClick=${()=>set(sec.id, vals[sec.id]+(vals[sec.id]?'\n':'')+tag+': ')}>
                +${tag}
              </span>
            `)}
          </div>
        </div>
      `)}
    </div>

    <!-- 주제 추출 버튼 -->
    <div class="card text-center">
      <button onClick=${extract} disabled=${!filled||loading}
        class="g-btn px-8 py-3 rounded-xl font-bold text-base disabled:opacity-40 transition shadow-md">
        ${loading ? '🤖 AI가 책 주제를 분석하는 중...' : '✨ 나에게 맞는 책 주제 추출하기'}
      </button>
      ${!filled?html`<p class="text-xs text-gray-400 mt-2">위 세 가지 중 하나 이상 작성하면 활성화됩니다</p>`:''}
    </div>

    <!-- 추출된 주제 -->
    ${extracted&&topics.length>0?html`
      <div class="card">
        <div class="flex items-center gap-2 mb-3">
          <span class="text-xl">🎯</span>
          <h3 class="font-bold text-gray-800">추천 책 주제 ${topics.length}개</h3>
          <span class="text-xs text-gray-400 ml-auto">클릭해서 마인드맵에 사용할 주제를 선택하세요</span>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-4">
          ${topics.map((t,i)=>html`
            <div key=${i}
              onClick=${()=>toggleTopic(t)}
              class=${'flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer transition border-2 '+(selTopics.includes(t)?'border-indigo-400 bg-indigo-50':'border-gray-100 bg-gray-50 hover:border-indigo-200 hover:bg-indigo-50/50')}>
              <span class="text-lg flex-shrink-0">${selTopics.includes(t)?'✅':'⭕'}</span>
              <span class=${'text-sm font-medium '+(selTopics.includes(t)?'text-indigo-700':'text-gray-700')}>${t}</span>
            </div>
          `)}
        </div>
        ${selTopics.length>0?html`
          <div class="bg-indigo-50 rounded-xl p-3 flex items-center justify-between">
            <div>
              <p class="text-sm font-semibold text-indigo-700">${selTopics.length}개 주제 선택됨</p>
              <p class="text-xs text-indigo-500 mt-0.5">다음 단계(마인드맵)에서 선택한 주제를 바탕으로 시작합니다</p>
            </div>
            <div class="flex flex-wrap gap-1 max-w-xs">
              ${selTopics.map(t=>html`<span key=${t} class="text-xs bg-indigo-200 text-indigo-800 px-2 py-1 rounded-full">${t}</span>`)}
            </div>
          </div>
        `:''}
      </div>
    `:''}
  </div>`;
}

// ── 마인드맵 ───────────────────────────────────────────
function MindMapStep({data, onChange, suggestedTopics=[]}) {
  const [root, setRoot] = useState(data || {id:'n0',text:suggestedTopics[0]||'나의 주제',level:0,children:[],color:'#FFD93D'});
  const [selId, setSelId] = useState(null);
  const [editTxt, setEditTxt] = useState('');
  const [addTxt, setAddTxt] = useState('');
  const [view, setView] = useState('map');

  const update = r => { setRoot(r); onChange(r); };

  const findNode = (node, id) => {
    if (node.id===id) return node;
    for (const c of node.children) { const f=findNode(c,id); if(f) return f; }
    return null;
  };
  const updateNode = (node, id, fn) => node.id===id ? fn(node) : {...node, children:node.children.map(c=>updateNode(c,id,fn))};
  const deleteNode = (node, id) => ({...node, children:node.children.filter(c=>c.id!==id).map(c=>deleteNode(c,id))});

  const selNode = selId ? findNode(root, selId) : null;

  // Layout
  const SVW=800, SVH=520;
  const pos = {};
  const cx=SVW/2, cy=SVH/2;
  pos[root.id]={x:cx,y:cy};
  const L1=root.children;
  const R1=Math.min(170,Math.max(120,110+L1.length*8));
  L1.forEach((n1,i)=>{
    const a=(2*Math.PI*i/Math.max(L1.length,1))-Math.PI/2;
    pos[n1.id]={x:cx+R1*Math.cos(a),y:cy+R1*Math.sin(a),a};
    const L2=n1.children;
    L2.forEach((n2,j)=>{
      const sp=Math.PI*.75, a2=L2.length===1?a:a-sp/2+sp*j/(L2.length-1);
      pos[n2.id]={x:pos[n1.id].x+105*Math.cos(a2),y:pos[n1.id].y+105*Math.sin(a2),a:a2};
      n2.children.forEach((n3,k)=>{
        const sp3=Math.PI*.5, a3=n2.children.length===1?a2:a2-sp3/2+sp3*k/(n2.children.length-1);
        pos[n3.id]={x:pos[n2.id].x+70*Math.cos(a3),y:pos[n2.id].y+70*Math.sin(a3)};
      });
    });
  });

  const radii={0:46,1:32,2:22,3:16};
  const fsizes={0:12,1:11,2:9,3:8};

  const Links = ({node}) => node.children.map(c => {
    const p=pos[node.id], q=pos[c.id];
    if(!p||!q) return null;
    return html`<g key=${'lk'+node.id+c.id}>
      <line x1=${p.x} y1=${p.y} x2=${q.x} y2=${q.y} stroke="#ccc" strokeWidth=${c.level===1?2:1.5} strokeDasharray=${c.level>1?'4,3':'none'}/>
      <${Links} node=${c}/>
    </g>`;
  });

  const Nodes = ({node}) => {
    const p=pos[node.id]; if(!p) return null;
    const r=radii[node.level]||14, fs=fsizes[node.level]||8;
    const mx=node.level===0?6:node.level===1?5:4;
    const lines=[]; for(let i=0;i<node.text.length;i+=mx) lines.push(node.text.slice(i,i+mx));
    return html`<g key=${node.id}>
      <g class="node-g" onClick=${()=>{setSelId(node.id);setEditTxt(node.text);}}>
        <circle cx=${p.x} cy=${p.y} r=${r} fill=${node.color} stroke=${selId===node.id?'#4c63d2':'rgba(0,0,0,.1)'} strokeWidth=${selId===node.id?3:1.5}/>
        ${lines.map((ln,li)=>html`<text key=${li} x=${p.x} y=${p.y+(li-(lines.length-1)/2)*fs*1.3} textAnchor="middle" dominantBaseline="middle" fontSize=${fs} fontWeight=${node.level===0?700:500} fill=${node.level===0?'#333':'#222'}>${ln}</text>`)}
      </g>
      ${node.children.map(c=>html`<${Nodes} key=${c.id} node=${c}/>`)}
    </g>`;
  };

  const flat=[]; const flatten=(n,d=0)=>{flat.push({...n,d});n.children.forEach(c=>flatten(c,d+1));};
  flatten(root);

  const addToParent = (parentId) => {
    if(!addTxt.trim()) return;
    const par=findNode(root,parentId);
    if(!par) return;
    const lvl=par.level+1;
    const ci=par.children.length;
    const child={...mkNode(addTxt.trim(),lvl,parentId,ci), color:(LEVEL_COLORS[Math.min(lvl,2)] instanceof Array?LEVEL_COLORS[Math.min(lvl,2)][ci%8]:LEVEL_COLORS[0])};
    update(updateNode(root,parentId,n=>({...n,children:[...n.children,child]})));
    setAddTxt('');
  };

  const QUICK=['경험담','노하우','실수사례','핵심팁','도구·툴','FAQ','성공사례','주의사항'];

  return html`<div class="space-y-4">
    ${suggestedTopics.length>0?html`
      <div class="card" style="background:linear-gradient(135deg,#f0fdf4,#ecfdf5);border:1px solid #bbf7d0">
        <div class="flex items-center gap-2 mb-2">
          <span class="text-lg">💡</span>
          <p class="text-sm font-bold text-green-700">브레인스토밍에서 추천된 주제</p>
          <span class="text-xs text-green-500 ml-auto">클릭하면 중심 주제로 설정</span>
        </div>
        <div class="flex flex-wrap gap-2">
          ${suggestedTopics.map((t,i)=>html`
            <button key=${i}
              onClick=${()=>update({...root, text:t})}
              class=${'px-3 py-1.5 rounded-full text-sm font-medium border-2 transition '+(root.text===t?'border-green-500 bg-green-500 text-white':'border-green-300 bg-white text-green-700 hover:bg-green-50')}>
              ${root.text===t?'✓ ':''} ${t}
            </button>
          `)}
        </div>
      </div>
    `:''}
    <div class="card">
      <div class="flex items-center justify-between mb-3">
        <div>
          <h2 class="text-xl font-bold text-gray-800">마인드맵으로 아이디어 정리</h2>
          <p class="text-sm text-gray-400 mt-0.5">중심 주제 아래 소주제를 추가해 목차의 뼈대를 만드세요</p>
        </div>
        <div class="flex gap-2">
          <button onClick=${()=>setView('map')} class=${'px-3 py-1.5 rounded-lg text-sm font-medium transition '+(view==='map'?'bg-indigo-500 text-white':'bg-gray-100 text-gray-600 hover:bg-gray-200')}>🗺️ 맵</button>
          <button onClick=${()=>setView('list')} class=${'px-3 py-1.5 rounded-lg text-sm font-medium transition '+(view==='list'?'bg-indigo-500 text-white':'bg-gray-100 text-gray-600 hover:bg-gray-200')}>📋 목록</button>
        </div>
      </div>

      <div class="flex items-center gap-3 p-3 bg-yellow-50 rounded-xl border border-yellow-200 mb-3">
        <span class="text-2xl">⭐</span>
        <div class="flex-1">
          <p class="text-xs font-semibold text-yellow-700 mb-0.5">중심 주제</p>
          <input value=${root.text} onInput=${e=>update({...root,text:e.target.value})}
            class="w-full bg-transparent text-lg font-bold text-gray-800 border-b-2 border-yellow-300 pb-1"
            placeholder="예: 재테크 입문, 다이어트 성공법, 여행 이야기..." />
        </div>
      </div>

      ${view==='map' ? html`
        <div class="rounded-xl overflow-hidden bg-gradient-to-br from-slate-50 to-indigo-50 border border-indigo-100 relative">
          <svg viewBox=${'0 0 '+SVW+' '+SVH} style="width:100%;min-height:380px">
            <${Links} node=${root}/>
            <${Nodes} node=${root}/>
          </svg>
          <div class="absolute bottom-2 right-3 text-xs text-gray-400 bg-white/80 px-2 py-1 rounded">노드 클릭 → 편집</div>
        </div>
      ` : html`
        <div class="space-y-0.5 max-h-80 overflow-y-auto">
          ${flat.map(n=>html`
            <div key=${n.id} class=${'flex items-center gap-2 py-2 px-3 rounded-lg cursor-pointer toc-row '+(selId===n.id?'bg-indigo-50':'')}
              style=${{paddingLeft:(n.d*22+12)+'px'}}
              onClick=${()=>{setSelId(n.id);setEditTxt(n.text);}}>
              <div class="w-3 h-3 rounded-full flex-shrink-0" style=${{background:n.color}}></div>
              <span class=${'text-sm '+(n.level===0?'font-bold text-gray-800':n.level===1?'font-semibold text-gray-700':'text-gray-600')}>${n.text}</span>
              <span class="text-xs text-gray-300 ml-auto">Lv${n.level}</span>
            </div>
          `)}
        </div>
      `}
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="card">

// ── 목차 ───────────────────────────────────────────────
function TOCStep({mindMap, data, onChange}) {
  const build = () => {
    if(!mindMap||!mindMap.children.length) return [];
    return mindMap.children.map((l1,i)=>({
      id:l1.id, num:i+1, title:l1.text, intro:'',
      sections:l1.children.map((l2,j)=>({id:l2.id,num:j+1,title:l2.text,
        subs:l2.children.map((l3,k)=>({id:l3.id,num:k+1,title:l3.text}))}))
    }));
  };
  const [toc,setTOC]=useState(data?.length?data:build());
  const [editing,setEditing]=useState(null);
  const [ev,setEv]=useState('');

  useEffect(()=>onChange(toc),[toc]);

  const move=(i,d)=>{ const t=[...toc]; const j=i+d; if(j<0||j>=t.length)return; [t[i],t[j]]=[t[j],t[i]]; setTOC(t.map((ch,idx)=>({...ch,num:idx+1}))); };
  const setT=(path,v)=>{ const t=JSON.parse(JSON.stringify(toc)); if(path.length===1)t[path[0]].title=v; else if(path.length===2)t[path[0]].sections[path[1]].title=v; else t[path[0]].sections[path[1]].subs[path[2]].title=v; setTOC(t); };
  const addSec=(ci)=>{ const t=JSON.parse(JSON.stringify(toc)); t[ci].sections.push({id:'s'+Date.now(),num:t[ci].sections.length+1,title:'새 절',subs:[]}); setTOC(t); };
  const addCh=()=>setTOC([...toc,{id:'c'+Date.now(),num:toc.length+1,title:'새 챕터',intro:'',sections:[]}]);
  const rmCh=(i)=>setTOC(toc.filter((_,idx)=>idx!==i).map((ch,idx)=>({...ch,num:idx+1})));
  const rmSec=(ci,si)=>{ const t=JSON.parse(JSON.stringify(toc)); t[ci].sections=t[ci].sections.filter((_,idx)=>idx!==si); setTOC(t); };

  return html`<div class="space-y-4">
    <div class="card">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 class="text-xl font-bold text-gray-800">목차 구성하기</h2>
          <p class="text-sm text-gray-400 mt-0.5">마인드맵 기반 자동 생성 · 순서/제목 편집 가능</p>
        </div>
        <button onClick=${addCh} class="g-btn px-4 py-2 rounded-xl text-sm font-medium">+ 챕터 추가</button>
      </div>

      ${toc.length===0?html`
        <div class="text-center py-12 text-gray-400">
          <p class="text-4xl mb-3">📭</p>
          <p>마인드맵에서 소주제를 추가하면 목차가 자동 생성됩니다</p>
        </div>
      `:html`
        <div class="space-y-3">
          ${toc.map((ch,ci)=>html`
            <div key=${ch.id} class="border border-indigo-100 rounded-xl overflow-hidden">
              <div class="bg-gradient-to-r from-indigo-50 to-purple-50 px-4 py-3 flex items-center gap-3">
                <span class="w-8 h-8 bg-indigo-500 text-white rounded-lg flex items-center justify-center text-sm font-bold flex-shrink-0">${ci+1}</span>
                ${editing===`ch${ci}`?html`
                  <input value=${ev} onInput=${e=>setEv(e.target.value)}
                    onBlur=${()=>{setT([ci],ev);setEditing(null);}}
                    onKeyDown=${e=>{if(e.key==='Enter'){setT([ci],ev);setEditing(null);}}}
                    class="flex-1 font-bold text-gray-800 bg-white border border-indigo-300 rounded-lg px-2 py-1 text-sm" autofocus/>
                `:html`
                  <span class="flex-1 font-bold text-gray-800 cursor-pointer hover:text-indigo-600" onClick=${()=>{setEditing(`ch${ci}`);setEv(ch.title);}}>${ch.title}</span>
                `}
                <div class="flex items-center gap-1">
                  <button onClick=${()=>move(ci,-1)} disabled=${ci===0} class="p-1 text-gray-400 hover:text-gray-700 disabled:opacity-20">▲</button>
                  <button onClick=${()=>move(ci,1)} disabled=${ci===toc.length-1} class="p-1 text-gray-400 hover:text-gray-700 disabled:opacity-20">▼</button>
                  <button onClick=${()=>rmCh(ci)} class="p-1 text-red-400 hover:text-red-600 ml-1 text-sm">✕</button>
                </div>
              </div>
              <div class="p-3 space-y-1">
                ${ch.sections.map((sec,si)=>html`
                  <div key=${sec.id} class="toc-row flex items-center gap-3 px-3 py-2">
                    <span class="text-xs text-gray-400 font-mono w-9 flex-shrink-0">${ci+1}-${si+1}</span>
                    ${editing===`s${ci}-${si}`?html`
                      <input value=${ev} onInput=${e=>setEv(e.target.value)}
                        onBlur=${()=>{setT([ci,si],ev);setEditing(null);}}
                        onKeyDown=${e=>{if(e.key==='Enter'){setT([ci,si],ev);setEditing(null);}}}
                        class="flex-1 text-sm text-gray-700 bg-white border border-indigo-300 rounded px-2 py-1" autofocus/>
                    `:html`
                      <span class="flex-1 text-sm text-gray-700 cursor-pointer hover:text-indigo-600" onClick=${()=>{setEditing(`s${ci}-${si}`);setEv(sec.title);}}>${sec.title}</span>
                    `}
                    <button onClick=${()=>rmSec(ci,si)} class="text-red-300 hover:text-red-500 text-xs flex-shrink-0">✕</button>
                  </div>
                `)}
                <button onClick=${()=>addSec(ci)} class="text-xs text-indigo-400 hover:text-indigo-600 hover:underline ml-12 py-1">+ 절 추가</button>
              </div>
            </div>
          `)}
        </div>
      `}
    </div>

    <div class="card">
      <h3 class="font-bold text-gray-700 mb-3">📖 목차 미리보기</h3>
      <div class="bg-gray-50 rounded-xl p-4 text-sm space-y-2 max-h-56 overflow-y-auto">
        ${toc.map((ch,ci)=>html`
          <div key=${ch.id}>
            <p class="font-bold text-gray-800">제${ci+1}장. ${ch.title}</p>
            ${ch.sections.map((s,si)=>html`<p key=${s.id} class="text-gray-600 pl-4 text-xs">${ci+1}.${si+1} ${s.title}</p>`)}
          </div>
        `)}
      </div>
    </div>
  </div>`;
}

// ── 문체 ───────────────────────────────────────────────
// 문체별 제목 변환 함수
const transformTitle = (orig, styleId, idx) => {
  const t = orig.replace(/하는\s*법$|방법$|기초$|개요$|입문$/,'').trim() || orig;
  const map = {
    casual: [
      `${t}, 사실 이렇게 하면 쉬워요`,
      `솔직하게 알려주는 ${t} 이야기`,
      `${t}? 저도 처음엔 몰랐어요`,
      `누구나 쉽게 하는 ${t}`,
      `${t} 어렵지 않아요, 같이 해봐요`,
    ],
    narrative: [
      `${t}을 처음 시작한 날`,
      `${t}이 내 삶을 바꾼 순간`,
      `아무도 말해주지 않은 ${t}의 진실`,
      `내가 ${t}을 선택한 이유`,
      `${t}에 관한 솔직한 이야기`,
    ],
    howto: [
      `[실전] ${t} 완벽 가이드`,
      `${t} 마스터하기 — 핵심 로드맵`,
      `실수 없이 ${t} 하는 법`,
      `${t}을 위한 단계별 체크리스트`,
      `${t} 핵심 공식 정리`,
    ],
    inspir: [
      `${t}으로 인생을 바꿀 수 있다`,
      `지금 당장 ${t}을 시작해야 하는 이유`,
      `당신도 할 수 있는 ${t}`,
      `${t}, 오늘이 바로 그날입니다`,
      `${t}의 힘을 믿으세요`,
    ],
    formal: [
      `${t}의 이론적 배경과 적용`,
      `${t}에 관한 체계적 고찰`,
      `${t}의 원리와 실제`,
      `${t}에 대한 심층적 이해`,
      `${t}의 개념 및 방법론 분석`,
    ],
    journal: [
      `${t}에 대해 생각하는 날`,
      `${t}을 돌아보며`,
      `${t}이라는 여정에서 배운 것`,
      `${t}에 관한 솔직한 고백`,
      `${t}이 내게 가르쳐 준 것들`,
    ],
  };
  const list = map[styleId] || [`${orig}`];
  return list[idx % list.length];
};

function StyleStep({data, onChange, toc=[]}) {
  const [cat,setCat]         = useState(data?.cat||'');
  const [style,setStyle]     = useState(data?.style||'');
  const [note,setNote]       = useState(data?.note||'');
  const [img,setImg]         = useState(data?.img||null);
  const [imgAnalyzing,setImgAnalyzing] = useState(false);
  const [imgDetected,setImgDetected]   = useState(data?.imgDetected||'');
  const [suggested,setSuggested]       = useState(false);
  // 목차 제목 변환 관련
  const [rewriting,setRewriting]       = useState(false);
  const [rewrittenTOC,setRewrittenTOC] = useState(data?.rewrittenTOC||null);
  const [approved,setApproved]         = useState(data?.approved||false);
  const fileRef = useRef(null);

  useEffect(()=>onChange({cat,style,note,img,imgDetected,rewrittenTOC,approved}),
    [cat,style,note,img,imgDetected,rewrittenTOC,approved]);

  const aiSuggest=()=>{
    const map={'자기계발':'casual','재테크·투자':'howto','심리·힐링':'journal','IT·테크':'howto','경제·경영':'formal','여행·취미':'narrative','요리·살림':'howto','건강·다이어트':'inspir','패션·뷰티':'narrative','글쓰기·창작':'narrative','부업·수익화':'howto','육아·교육':'casual'};
    setStyle(map[cat]||'casual'); setSuggested(true); setTimeout(()=>setSuggested(false),2500);
  };

  const handleImgUpload = e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ev => {
      setImg(ev.target.result);
      setImgAnalyzing(true); setImgDetected('');
      // 이미지 분석 mock (실제 Claude Vision API 연동 위치)
      setTimeout(()=>{
        const detected = ['친근하고 가벼운 대화체 스타일','감성적인 에세이·일기체 스타일','단계별 설명이 명확한 실용서 스타일','감동적인 동기부여·자기계발 스타일','전문적이고 격식 있는 비즈니스 스타일','개인 스토리 중심의 내러티브 스타일'];
        setImgDetected(detected[Math.floor(Math.random()*detected.length)]);
        setImgAnalyzing(false);
      }, 1800);
    };
    r.readAsDataURL(f);
  };

  // 개별 제목 편집 상태
  const [editingId, setEditingId] = useState(null);   // 'ch-0' | 'sec-0-1' | null
  const [editVal,   setEditVal]   = useState('');

  // rewrittenTOC에서 단일 타이틀 업데이트
  const updateOneTitle = (ci, si, val) => {
    setRewrittenTOC(prev => {
      const t = JSON.parse(JSON.stringify(prev));
      if (si === -1) t[ci].title = val;
      else t[ci].sections[si].title = val;
      return t;
    });
    setApproved(false);
  };

  // 개별 항목 AI 재생성
  const rewriteOne = (ci, si) => {
    const orig = si === -1
      ? (rewrittenTOC[ci].origTitle || rewrittenTOC[ci].title)
      : (rewrittenTOC[ci].sections[si].origTitle || rewrittenTOC[ci].sections[si].title);
    // 다음 variant 인덱스 (현재 번호+1 회전)
    const curTitle = si === -1 ? rewrittenTOC[ci].title : rewrittenTOC[ci].sections[si].title;
    const map = {
      casual:    [`${orig}, 사실 이렇게 하면 쉬워요`,`솔직하게 알려주는 ${orig} 이야기`,`${orig}? 저도 처음엔 몰랐어요`,`누구나 쉽게 하는 ${orig}`,`${orig} 어렵지 않아요, 같이 해봐요`],
      narrative: [`${orig}을 처음 시작한 날`,`${orig}이 내 삶을 바꾼 순간`,`아무도 말해주지 않은 ${orig}의 진실`,`내가 ${orig}을 선택한 이유`,`${orig}에 관한 솔직한 이야기`],
      howto:     [`[실전] ${orig} 완벽 가이드`,`${orig} 마스터하기 — 핵심 로드맵`,`실수 없이 ${orig} 하는 법`,`${orig}을 위한 단계별 체크리스트`,`${orig} 핵심 공식 정리`],
      inspir:    [`${orig}으로 인생을 바꿀 수 있다`,`지금 당장 ${orig}을 시작해야 하는 이유`,`당신도 할 수 있는 ${orig}`,`${orig}, 오늘이 바로 그날입니다`,`${orig}의 힘을 믿으세요`],
      formal:    [`${orig}의 이론적 배경과 적용`,`${orig}에 관한 체계적 고찰`,`${orig}의 원리와 실제`,`${orig}에 대한 심층적 이해`,`${orig}의 개념 및 방법론 분석`],
      journal:   [`${orig}에 대해 생각하는 날`,`${orig}을 돌아보며`,`${orig}이라는 여정에서 배운 것`,`${orig}에 관한 솔직한 고백`,`${orig}이 내게 가르쳐 준 것들`],
    };
    const variants = map[style] || [`${orig}`];
    const curIdx = variants.indexOf(curTitle);
    const next = variants[(curIdx + 1) % variants.length];
    updateOneTitle(ci, si, next);
  };

  const startEdit = (id, val) => { setEditingId(id); setEditVal(val); };
  const saveEdit  = (ci, si)  => { updateOneTitle(ci, si, editVal.trim()||editVal); setEditingId(null); };

  // 다시 생성할 때마다 다른 변형이 나오도록 offset 추적
  const rewriteOffset = useRef(0);

  const doRewrite = () => {
    if(!style||!toc.length) return;
    setRewriting(true); setApproved(false);
    // 재생성 시 다음 변형 세트로 이동 (5가지 변형 순환)
    rewriteOffset.current = (rewriteOffset.current + 1) % 5;
    const offset = rewriteOffset.current;
    setTimeout(()=>{
      let counter = 0;
      const newTOC = toc.map(ch => {
        const origCh = ch.origTitle || ch.title;
        return {
          ...ch,
          origTitle: origCh,
          title: transformTitle(origCh, style, offset + counter++),
          sections: (ch.sections||[]).map(s => {
            const origSec = s.origTitle || s.title;
            return {
              ...s,
              origTitle: origSec,
              title: transformTitle(origSec, style, offset + counter++),
            };
          }),
        };
      });
      setRewrittenTOC(newTOC);
      setRewriting(false);
    }, 1200);
  };

  const selStyle = WRITING_STYLES.find(s=>s.id===style);
  const displayTOC = rewrittenTOC || toc;

  return html`<div class="space-y-4">

    <!-- ① 카테고리 + 문체 선택 -->
    <div class="card">
      <h2 class="text-xl font-bold text-gray-800 mb-1">문체 & 톤 선택</h2>
      <p class="text-sm text-gray-400 mb-4">책의 분위기를 결정하는 단계입니다. 선택 후 목차 제목을 해당 문체로 변환할 수 있습니다.</p>

      <div class="mb-4">
        <p class="text-sm font-semibold text-gray-700 mb-2">📚 카테고리</p>
        <div class="flex flex-wrap gap-1">
          ${CATEGORIES.map(c=>html`
            <button key=${c} onClick=${()=>setCat(c)}
              class=${'tag text-sm '+(cat===c?'bg-indigo-500 text-white':'bg-gray-100 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600')}>
              ${c}
            </button>
          `)}
        </div>
        ${cat?html`
          <div class="mt-2 flex items-center gap-2 flex-wrap">
            <span class="text-xs text-green-600">✓ ${cat}</span>
            <button onClick=${aiSuggest} class="text-xs bg-green-50 text-green-600 border border-green-200 px-3 py-1 rounded-full hover:bg-green-100">🤖 AI 추천</button>
            ${suggested?html`<span class="text-xs text-indigo-500">✨ 추천 완료!</span>`:''}
          </div>
        `:''}
      </div>

      <div class="mb-4">
        <p class="text-sm font-semibold text-gray-700 mb-2">✍️ 문체 선택</p>
        <div class="grid grid-cols-2 lg:grid-cols-3 gap-2">
          ${WRITING_STYLES.map(s=>html`
            <div key=${s.id} class=${'scard'+(style===s.id?' on':'')} onClick=${()=>{setStyle(s.id);setRewrittenTOC(null);setApproved(false);}}>
              <div class="flex items-center gap-1.5 mb-1">
                <span class="text-xl">${s.icon}</span>
                <span class="font-semibold text-gray-800 text-xs">${s.name}</span>
                ${style===s.id?html`<span class="ml-auto text-indigo-500 text-xs">✓</span>`:''}
              </div>
              <p class="text-xs text-gray-500 mb-1.5">${s.desc}</p>

                              <button

                                🔁
                              </button>
                              <button

            ${approved ? html`

            <p class="text-xs text-gray-400 mb-2">변환될 목차 (${toc.length}챕터 · ${toc.reduce((a,c)=>a+c.sections.length,0)}절)</p>
            ${toc.map((ch,ci)=>html`

// ── 제목 ───────────────────────────────────────────────
function TitleStep({mindMap, styleData, toc=[], data, onChange}) {
  const [kw,setKw]           = useState(data?.kw||mindMap?.text||'');
  const [sub,setSub]         = useState(data?.sub||'');
  const [subType,setSubType] = useState(data?.subType||'sentence');
  const [subList,setSubList] = useState(data?.subList||[]);
  const [subLoading,setSubLoading] = useState(false);
  const [list,setList]       = useState(data?.list||[]);
  const [sel,setSel]         = useState(data?.sel||'');
  const [final,setFinal]     = useState(data?.final||'');
  const [loading,setLoading] = useState(false);
  const [refImg,setRefImg]           = useState(data?.refImg||null);
  const [refAnalyzing,setRefAnalyzing] = useState(false);
  const [refDetected,setRefDetected]   = useState(data?.refDetected||'');
  const fileRef  = useRef(null);
  const subOffset = useRef(0);

  useEffect(()=>onChange({kw,sub,subType,subList,list,sel,final,refImg,refDetected}),[kw,sub,subType,subList,list,sel,final,refImg,refDetected]);

  const handleRefImg = e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ev => {
      setRefImg(ev.target.result);
      setRefAnalyzing(true); setRefDetected('');
      setTimeout(()=>{
        const styles = [
          '짧고 강렬한 단어형 제목 스타일 (예: "린 스타트업", "아주 작은 습관")',
          '질문형·호기심 유발 제목 스타일 (예: "왜 나는 항상 실패할까?")',
          '숫자 포함 리스트형 제목 스타일 (예: "돈의 속성 7가지")',
          '감성·스토리형 제목 스타일 (예: "어제의 나는 틀렸다")',
          '직접 지시형 제목 스타일 (예: "그냥 하지 말라", "일단 시작하라")',
          '혜택 강조형 제목 스타일 (예: "30일 만에 완성하는 ○○")',
        ];
        setRefDetected(styles[Math.floor(Math.random()*styles.length)]);
        setRefAnalyzing(false);
      }, 1600);
    };
    r.readAsDataURL(f);
  };

  // 문체 확정된 목차에서 키워드 자동 추출
  const tocKeyword = styleData?.rewrittenTOC?.[0]?.origTitle || mindMap?.text || '';

  const genOffset = useRef(0);

  // 목차에서 핵심 키워드 추출 헬퍼
  const getTocKws = () => (toc||[]).slice(0,5)
    .map(ch => (ch.origTitle||ch.title).replace(/^제\d+장\.?\s*/,'').trim())
    .filter(Boolean);

  const generate = () => {
    if(!kw.trim()) return;
    setLoading(true);
    genOffset.current = (genOffset.current + 1) % 6;
    const off = genOffset.current;
    setTimeout(()=>{
      const k = kw.trim();
      const tocKws = getTocKws();
      const t1 = tocKws[0] || k;
      const t2 = tocKws[1] || '';
      const n  = [['3가지','5가지','7가지','30일','10단계','21일'], ['비밀','법칙','습관','기술','공식','원칙']];
      const pick = (arr, i) => arr[(i + off) % arr.length];
      const allBase = [
        [`${k}으로 인생이 달라지는 ${pick(n[0],0)} ${pick(n[1],0)}`,`${k} 한 권으로 ${pick(n[0],1)} 달라지는 이유`,`${k}의 모든 것: ${pick(n[1],1)} 완전 정복 가이드`],
        [`${pick(n[0],2)} 안에 ${k} 완전 정복`,`${k}를 ${pick(n[0],3)} 만에 내 것으로 만드는 법`,`${k} ${pick(n[0],4)}: 지금 당장 시작하는 완벽 입문`],
        [`왜 당신의 ${k}은 아직 시작되지 않았을까?`,`당신이 ${k}에 실패하는 진짜 이유`,`${k}, 왜 나는 안 될까?`],
        [`${k}, 이렇게 하면 달라집니다`,`${k}이 쉬워지는 ${pick(n[0],0)} ${pick(n[1],2)}`,`${k} 고수들의 ${pick(n[1],3)}`],
        [`처음 시작하는 ${k} 완벽 입문`,`${k} 입문자를 위한 친절한 안내서`,`${k} 왕초보 탈출 프로젝트`],
        [`${k}의 ${pick(n[1],4)}`,`${k}을 바꾸는 작은 ${pick(n[1],5)}들`,`나만의 ${k} ${pick(n[1],0)}`],
        [`아무도 알려주지 않은 ${k}의 진실`,`${k}에 대해 아무도 말해주지 않는 것들`,`${k} 전문가만 아는 숨겨진 비밀`],
        [`하루 15분으로 완성하는 ${k}`,`매일 조금씩, ${pick(n[0],2)} 후 달라지는 ${k}`,`틈새 시간으로 완성하는 ${k}`],
        [`${k} 전문가가 되는 ${pick(n[0],1)} 핵심 ${pick(n[1],5)}`,`${k} 고수로 가는 가장 빠른 길`,`${k} 실력을 ${pick(n[0],4)} 만에 끌어올리는 법`],
        [`${k} 하나로 인생을 바꾼 사람들의 이야기`,`${k}이 삶을 바꿨습니다`,`${k}으로 달라진 ${pick(n[0],3)}: 실전 성공 스토리`],
      ];
      const base = allBase.map(variants => variants[off % variants.length]);

      // 목차 키워드 연계 제목
      const tocTitles = tocKws.length >= 2
        ? [
            `${t1}부터 ${t2}까지, ${k} 완벽 로드맵`,
            `${tocKws.slice(0,2).join(', ')}을 한 권에 담은 ${k} 가이드`,
            `${t1}으로 시작해 ${t2}로 완성하는 ${k}`,
          ].map((t,i)=>[`${t1}부터 ${t2}까지, ${k} 완벽 로드맵`,`${tocKws.slice(0,2).join(', ')}을 한 권에 담은 ${k} 가이드`,`${t1}으로 시작해 ${t2}로 완성하는 ${k}`][(i+off)%3])
            .filter((v,i,a)=>a.indexOf(v)===i)
        : tocKws.length === 1
          ? [`${t1}의 모든 것: ${k} 완전 정복`, `${t1}을 중심으로 배우는 ${k}`]
          : [];

      // 참고 이미지 스타일 반영
      let refExtra = [];
      if(refDetected) {
        const r = refDetected;
        if(r.includes('짧고') || r.includes('임팩트')) refExtra = [`${k}`,`${k}의 힘`,`${k}, 지금`,`단 하나의 ${k}`,`${k}: 원칙`];
        else if(r.includes('질문')) refExtra = [`당신은 왜 아직 ${k}을 시작하지 않았나?`,`${k}, 당신에게 무엇인가요?`,`지금 ${k}하지 않으면 언제 할 것인가?`,`${k}, 두렵습니까 아니면 설레십니까?`];
        else if(r.includes('숫자')) refExtra = [`${k}의 7가지 법칙`,`${k}으로 성공한 사람들의 5가지 공통점`,`하루 3가지 ${k} 루틴`,`${k} 고수가 되는 9가지 비밀`];
        else if(r.includes('감성') || r.includes('스토리')) refExtra = [`${k}이 내 삶을 바꾼 날`,`그날 이후, 나의 ${k}`,`${k}이라는 여정`,`어느 날 나는 ${k}을 만났다`];
        else if(r.includes('지시') || r.includes('직접')) refExtra = [`지금 당장 ${k}하라`,`그냥 ${k}해버려라`,`${k}, 일단 시작하라`,`더 이상 미루지 마라: ${k}`];
        else if(r.includes('혜택') || r.includes('30일')) refExtra = [`30일 만에 완성하는 ${k}`,`${pick(n[0],3)} ${k} 챌린지`,`${pick(n[0],2)} ${k} 완성 플랜`,`${k} ${pick(n[0],4)} 성공 프로젝트`];
        else refExtra = [`${k}의 새로운 기준`,`${k}을 다시 정의하다`,`${k}의 정석`,`나만의 ${k} 만들기`,`${k} 마스터 클래스`];
        refExtra = refExtra.map((t,i) => refExtra[(i + off) % refExtra.length]).slice(0,4);
      }
      setList([...base, ...tocTitles, ...refExtra]);
      setLoading(false);
    }, 1200);
  };

  const genSub = () => {
    if(!kw.trim()) return;
    setSubLoading(true);
    subOffset.current = (subOffset.current + 1) % 5;
    const off = subOffset.current;
    setTimeout(()=>{
      const k = kw.trim();

          tocKws.length ? `${tocKws.slice(0,2).join(', ')}을 한 권에 담은 실전 교과서` : `${k}의 모든 것을 담은 실전 교과서`,

          `${k}으로 인생을 바꾼 사람들의 진짜 이야기`,
        ];
      } else if(subType === 'short') {
        subs = [
          `${k} 완전 정복`,
          `${k} 실전 가이드`,
          `${k} 핵심 노하우`,
          `${k} 마스터 클래스`,
          `${k} 완벽 입문`,
          `${t1} 성공 전략`,
        ];
      } else {
        const kws = [...new Set([t1, t2, ...tocKws.slice(0,3)].filter(Boolean))].slice(0,4);
        subs = [
          kws.join(' | '),
          kws.map(w=>'#'+w).join(' '),
          `${k} · 전략 · 실전 · 성공`,
          kws.slice(0,3).join(' + '),
          `${kws[0]||k}, ${kws[1]||'핵심 정리'}, 실전 가이드`,
          `${k} — ${kws.slice(0,2).join(' & ')||'핵심 노하우'}`,
        ];
      }
      // off로 순서 회전
      const rotated = subs.map((_,i) => subs[(i + off) % subs.length]);
      setSubList(rotated);
      setSubLoading(false);
    }, 700);
  };

  return html`<div class="space-y-4">
    <div class="card">
      <h2 class="text-xl font-bold text-gray-800 mb-1">제목 다듬기</h2>
      <p class="text-sm text-gray-400 mb-4">베스트셀러 패턴 + 참고 이미지 스타일을 반영한 AI 제목 생성</p>

      <!-- 문체 확정 연동 알림 -->
      ${styleData?.approved&&styleData?.rewrittenTOC?html`
        <div class="bg-green-50 border border-green-200 rounded-xl px-4 py-2.5 mb-4 flex items-center gap-2">
          <span class="text-green-500">✅</span>
          <p class="text-xs text-green-700">이전 단계에서 <strong>${WRITING_STYLES.find(s=>s.id===styleData.style)?.name}</strong> 문체가 확정되었습니다. 제목도 해당 문체 스타일로 반영됩니다.</p>
        </div>
      `:''}

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
          <p class="text-sm font-semibold text-gray-700 mb-1">핵심 키워드</p>
          <input value=${kw} onInput=${e=>setKw(e.target.value)}
            class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm"
            placeholder="예: 재테크, 글쓰기, 다이어트..."/>
          ${tocKeyword&&tocKeyword!==kw?html`
            <button onClick=${()=>setKw(tocKeyword)} class="mt-1 text-xs text-indigo-500 hover:underline">
              💡 목차 키워드 사용: "${tocKeyword}"
            </button>
          `:''}
        </div>
        <div>
          <!-- 부제목 헤더: 타입 선택 + AI 버튼 -->
          <div class="flex items-center justify-between mb-2 flex-wrap gap-2">
            <p class="text-sm font-semibold text-gray-700">부제목 (선택)</p>
            <div class="flex items-center gap-1.5 flex-wrap">
              ${[['sentence','문장형'],['short','간결형'],['keyword','키워드형']].map(([t,label])=>html`
                <button key=${t} onClick=${()=>{setSubType(t);setSubList([]);}}
                  class=${'text-xs px-2.5 py-1 rounded-lg border font-medium transition '+(subType===t?'bg-indigo-500 text-white border-indigo-500':'bg-white text-gray-500 border-gray-200 hover:border-indigo-300 hover:text-indigo-600')}>
                  ${label}
                </button>
              `)}
              <button onClick=${genSub} disabled=${subLoading||!kw.trim()}
                class="text-xs px-3 py-1 g-btn rounded-lg font-semibold disabled:opacity-40 ml-1 transition">
                ${subLoading?'⏳':'✨ AI 추천'}
              </button>
            </div>
          </div>
          <input value=${sub} onInput=${e=>setSub(e.target.value)}
            class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm"
            placeholder=${subType==='sentence'?'예: 초보자도 따라 할 수 있는 완벽 가이드':subType==='short'?'예: 핵심 노하우 완전 정복':'예: 재테크 | 투자 | 경제적 자유'}/>
          <!-- 추천 목록 -->
          ${subList.length>0?html`
            <div class="mt-2 flex flex-wrap gap-1.5">
              ${subList.map((s,i)=>html`
                <button key=${i} onClick=${()=>setSub(s)}
                  class=${'text-xs px-3 py-1.5 rounded-lg border transition '+(sub===s?'border-indigo-400 bg-indigo-50 text-indigo-700 font-medium':'border-gray-200 bg-white text-gray-600 hover:border-indigo-300 hover:bg-indigo-50/50')}>
                  ${s}
                </button>
              `)}
            </div>
          `:''}
        </div>
      </div>

      <!-- 제목 스타일 참고 이미지 -->
      <div class="border-2 border-dashed border-amber-200 rounded-xl p-4 mb-4 bg-amber-50/40">
        <div class="flex items-start gap-4">
          <div class="flex-1">
            <h4 class="font-semibold text-amber-800 text-sm mb-1">📎 원하는 제목 스타일 참고 이미지 (선택)</h4>
            <p class="text-xs text-amber-600 mb-2">마음에 드는 책 표지나 제목 스타일 이미지를 첨부하면 그 스타일로 제목을 생성합니다</p>
            <button onClick=${()=>fileRef.current?.click()} class="bg-amber-100 text-amber-700 border border-amber-300 px-3 py-1.5 rounded-lg text-xs hover:bg-amber-200">

            <input ref=${fileRef} type="file" accept="image/*" style="display:none" onChange=${handleRefImg}/>
          </div>
          ${refImg?html`

                <button onClick=${()=>{setRefImg(null);setRefDetected('');}} class="absolute -top-2 -right-2 w-5 h-5 bg-red-500 text-white rounded-full text-xs flex items-center justify-center">✕</button>
              </div>
              ${refAnalyzing?html`
                <div class="mt-1.5 flex items-center gap-1 text-xs text-amber-600">
                  <span>⏳</span> 스타일 분석 중...
                </div>
              `:refDetected?html`
                <div class="mt-1.5 bg-amber-100 border border-amber-300 rounded-lg px-2 py-1.5" style="max-width:130px">
                  <p class="text-xs font-semibold text-amber-800">감지된 제목 스타일</p>
                  <p class="text-xs text-amber-700 leading-tight mt-0.5">${refDetected}</p>
                </div>
              `:''}
            </div>
          `:''}
        </div>
      </div>

      <button onClick=${generate} disabled=${loading||!kw.trim()}
        class="w-full g-btn rounded-xl py-3 font-bold disabled:opacity-40 mb-4 transition">
        ${loading?'🤖 AI가 제목 생성 중...':refDetected?'✨ 참고 이미지 스타일 반영해서 제목 생성':'✨ AI 제목 생성 (베스트셀러 패턴 반영)'}
      </button>

          ${PATTERNS.map((p,i)=>html`<p key=${i} class="text-xs text-amber-700">• ${p}</p>`)}
        </div>
      </div>

      <!-- 생성된 후보 -->
      ${list.length>0?html`
        <div>
          <div class="flex items-center justify-between mb-2">
            <p class="font-semibold text-gray-700">🎯 제목 후보 ${list.length}개</p>
            <button onClick=${generate} class="text-xs text-indigo-500 hover:underline">🔁 재생성</button>

          <div class="space-y-2">
            ${list.map((t,i)=>html`
              <div key=${i} class=${'tcard'+(sel===t?' on':'')} onClick=${()=>{setSel(t);setFinal(t);}}>
                <div class="flex items-center gap-3">
                  <span class="text-xs text-gray-400 font-mono w-5 flex-shrink-0">${i+1}</span>
                  <span class="text-sm font-medium text-gray-800 flex-1">${t}</span>
                  ${sel===t?html`<span class="text-indigo-500 text-xs font-bold">✓</span>`:''}
                </div>
              </div>
            `)}
          </div>
        </div>
      `:''}

      <!-- 최종 제목 -->
      <div class="mt-5 pt-4 border-t border-gray-100">
        <p class="text-sm font-semibold text-gray-700 mb-2">✏️ 최종 제목 확정 (직접 수정 가능)</p>
        <input value=${final} onInput=${e=>setFinal(e.target.value)}
          class="w-full border-2 border-indigo-200 rounded-xl px-4 py-3 text-base font-bold text-gray-800"
          placeholder="위에서 선택하거나 직접 입력하세요..."/>
        ${final?html`
          <div class="mt-3 bg-indigo-50 rounded-xl p-4">
            <p class="font-black text-indigo-800 text-xl leading-tight">${final}</p>
            ${sub?html`<p class="text-indigo-600 text-sm mt-2 font-medium">${sub}</p>`:''}
          </div>
        `:''}
      </div>
    </div>
  </div>`;
}

function CoverStep({titleData, toc, data, onChange}) {

  const [bg2,    setBg2]    = useState(data?.bg2    || DEF.bg2);
  const [textC,  setTextC]  = useState(data?.textC  || DEF.text);
  const [accent, setAccent] = useState(data?.accent || DEF.accent);
  const [fonts,  setFonts]  = useState(data?.fonts  || []);
  const [title,  setTitle]  = useState(titleData?.final || data?.title  || '');
  const [sub,    setSub]    = useState(titleData?.sub   || data?.sub    || '');
  const [author, setAuthor] = useState(data?.author || '');
  const [intro,  setIntro]  = useState(data?.intro  || '');
  const [prompt, setPrompt] = useState(data?.prompt || '');
  const [bgImg,  setBgImg]  = useState(data?.bgImg  || null);
  const [pDone,  setPDone]  = useState(false);
  const [saving, setSaving] = useState(false);
  const coverRef = useRef(null);
  const bgImgRef = useRef(null);

  const [previewTab, setPreviewTab] = useState('text');
  const gradientStyle = `linear-gradient(160deg, ${bg1}, ${bg2})`;

  useEffect(()=>onChange({selId,bg1,bg2,textC,accent,fonts,title,sub,author,intro,prompt,bgImg}),
    [selId,bg1,bg2,textC,accent,fonts,title,sub,author,intro,prompt,bgImg]);

  const applyPreset = p => {
    setSelId(p.id); setBg1(p.bg1); setBg2(p.bg2); setTextC(p.text); setAccent(p.accent);
  };

  const toggleFont = f => {
    if(fonts.find(x=>x.id===f.id)) setFonts(fonts.filter(x=>x.id!==f.id));
    else if(fonts.length<2) setFonts([...fonts,f]);
  };

  const [introLoading, setIntroLoading] = useState(false);

    setIntroLoading(true);

      const t = title || '이 책';

      const kws = chapters.join(', ') || '핵심 내용';

        `${t}이 당신의 삶을 바꿀 것입니다.\n${kws}을 통해 지금 바로 시작하세요.`,
        `${kws}의 모든 것을 담았습니다.\n한 권으로 끝내는 완벽한 가이드.`,
        `막막했던 ${chapters[0]||t},\n이제 이 책 한 권으로 해결하세요.`,
        `수많은 시행착오 끝에 찾아낸 ${t}의 핵심.\n당신의 시간을 아껴드립니다.`,
        `${t}을 통해 원하는 삶에 한 발 더 가까워지세요.\n지금 이 순간이 변화의 시작입니다.`,
      ];

        backgroundColor: null,

// ── 내보내기 패널 ──────────────────────────────────────
function ExportPanel({mindMap, toc, styleData, titleData, coverData}) {
  const [done, setDone] = useState('');

  const flash = id => { setDone(id); setTimeout(() => setDone(''), 2200); };

  const handleCopyTOC = () => {
    const lines = [];
    (toc||[]).forEach((ch, ci) => {
      lines.push(`제${ci+1}장. ${ch.title}`);
      (ch.sections||[]).forEach((s, si) => lines.push(`  ${ci+1}.${si+1} ${s.title}`));
    });
    clipCopy(lines.join('\n')).then(() => flash('toc'));
  };

  const handleCopyMD = () => {
    clipCopy(buildMarkdown(titleData, toc, styleData, coverData, mindMap)).then(() => flash('md'));
  };

  const handleDlMD = () => {
    dlFile(buildMarkdown(titleData, toc, styleData, coverData, mindMap),
      safeFilename(titleData?.final) + '.md', 'text/markdown;charset=utf-8');
    flash('dlmd');
  };

  const handleDlCover = () => {
    dlFile(buildCoverHTML(titleData, coverData),
      safeFilename(titleData?.final) + '_표지.html', 'text/html;charset=utf-8');
    flash('cover');
  };

  const handleDlSummary = () => {
    dlFile(buildSummaryHTML(titleData, toc, styleData, coverData, mindMap),
      safeFilename(titleData?.final) + '_요약.html', 'text/html;charset=utf-8');
    flash('sum');
  };

  const BTNS = [
    {
      id:'toc', icon:'📋', label:'목차 복사',
      desc:'텍스트로 클립보드 복사',
      color:'border-blue-200 bg-blue-50 text-blue-700 hover:bg-blue-100',
      onClick: handleCopyTOC,
    },
    {
      id:'md', icon:'📝', label:'전체 복사',
      desc:'마크다운 형식으로 복사',
      color:'border-purple-200 bg-purple-50 text-purple-700 hover:bg-purple-100',
      onClick: handleCopyMD,
    },
    {
      id:'dlmd', icon:'⬇️', label:'마크다운 저장',
      desc:'.md 파일 다운로드',
      color:'border-indigo-200 bg-indigo-50 text-indigo-700 hover:bg-indigo-100',
      onClick: handleDlMD,
    },
    {
      id:'cover', icon:'🖼️', label:'표지 저장',
      desc:'HTML 파일 · 브라우저 인쇄 가능',
      color:'border-orange-200 bg-orange-50 text-orange-700 hover:bg-orange-100',
      onClick: handleDlCover,
    },
    {
      id:'sum', icon:'📄', label:'요약 저장',
      desc:'전체 요약 HTML 파일',
      color:'border-green-200 bg-green-50 text-green-700 hover:bg-green-100',
      onClick: handleDlSummary,
    },
  ];

  return html`<div class="card">
    <div class="flex items-center gap-3 mb-4">
      <span class="text-2xl">📥</span>
      <div>
        <h3 class="font-bold text-gray-800">내보내기</h3>
        <p class="text-xs text-gray-400">원하는 형식으로 결과물을 저장하거나 복사하세요</p>
      </div>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 mb-4">
      ${BTNS.map(b => html`
        <button key=${b.id} onClick=${b.onClick}
          class=${'border-2 rounded-xl p-3 text-center transition ' + b.color}>
          <p class="text-2xl mb-1">${done===b.id ? '✅' : b.icon}</p>
          <p class="text-xs font-bold leading-tight">${done===b.id ? (b.id==='toc'||b.id==='md' ? '복사됨!' : '저장됨!') : b.label}</p>
          <p class="text-xs opacity-60 mt-0.5 leading-tight">${b.desc}</p>
        </button>

      <span class="text-lg flex-shrink-0 mt-0.5">💡</span>

// ── 메인 앱 ────────────────────────────────────────────
const STORAGE_KEY = 'ebook-draft-v1';

const loadSaved = () => {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
};

function App() {
  const saved = loadSaved();
  const [step,setStep]           = useState(saved.step ?? 0);
  const [bsData,setBsData]       = useState(saved.bsData || {});
  const [mindMap,setMindMap]     = useState(saved.mindMap || null);
  const [toc,setTOC]             = useState(saved.toc || []);
  const [styleData,setStyleData] = useState(saved.styleData || {});
  const [titleData,setTitleData] = useState(saved.titleData || {});
  const [coverData,setCoverData] = useState(saved.coverData || {});
  const [done,setDone]           = useState(saved.done || false);
  const [savedAt,setSavedAt]     = useState('');

  // 자동 저장
  useEffect(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({step,bsData,mindMap,toc,styleData,titleData,coverData,done}));
      const t = new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
      setSavedAt(t);
    } catch {}
  }, [step,bsData,mindMap,toc,styleData,titleData,coverData,done]);

  // 전체 초기화
  const resetAll = () => {
    if(!confirm('모든 내용을 지우고 처음부터 시작할까요?\n작성한 내용이 모두 삭제됩니다.')) return;
    localStorage.removeItem(STORAGE_KEY);
    setStep(0); setBsData({}); setMindMap(null); setTOC([]); setStyleData({}); setTitleData({}); setCoverData({}); setDone(false);
  };

  // 브레인스토밍 → 마인드맵: 선택한 주제를 중심 주제로 전달
  const handleBsExtract = (selTopics) => {
    if(selTopics.length>0 && !mindMap) {
      setMindMap({id:'n0',text:selTopics[0],level:0,children:[],color:'#FFD93D'});
    }
  };

  const canNext=()=>{
    if(done) return true;
    if(step===0) return Object.values(bsData?.vals||{}).some(v=>v?.trim().length>0);
    if(step===1) return mindMap&&mindMap.children.length>0;
    if(step===2) return toc.length>0;
    if(step===3) return !!styleData.style;
    if(step===4) return !!(titleData.final||titleData.kw);
    return true;
  };

  const next=()=>{
    // 브레인스토밍 → 마인드맵으로 넘어갈 때 선택 주제 반영
    if(step===0 && bsData?.selTopics?.length>0 && !mindMap) {
      setMindMap({id:'n0',text:bsData.selTopics[0],level:0,children:[],color:'#FFD93D'});
    }
    if(step<STEPS.length-1) setStep(s=>s+1); else setDone(true);
  };
  const back=()=>{ if(done){setDone(false);return;} if(step>0) setStep(s=>s-1); };

  return html`<div class="min-h-screen">
    <div class="g-bg text-white py-4 px-6 shadow-lg">
      <div class="max-w-5xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-3">
          <span class="text-2xl">📚</span>
          <div>
            <h1 class="font-black text-lg leading-tight">전자책 초안 작성 앱</h1>
            <p class="text-xs" style="color:rgba(255,255,255,.7)">브레인스토밍부터 표지까지 한 번에</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          ${savedAt?html`
            <div class="text-right hidden sm:block">
              <p class="text-xs" style="color:rgba(255,255,255,.55)">자동 저장됨</p>
              <p class="text-xs font-semibold" style="color:rgba(255,255,255,.85)">${savedAt}</p>
            </div>
          `:''}
          <button onClick=${resetAll}
            class="text-xs px-3 py-1.5 rounded-lg border font-medium transition"
            style="border-color:rgba(255,255,255,.3);color:rgba(255,255,255,.7);background:rgba(255,255,255,.08)"
            onMouseOver=${e=>e.currentTarget.style.background='rgba(255,255,255,.18)'}
            onMouseOut=${e=>e.currentTarget.style.background='rgba(255,255,255,.08)'}>
            🗑️ 초기화
          </button>
          ${!done?html`<div class="text-right"><p class="text-xs" style="color:rgba(255,255,255,.7)">진행</p><p class="font-bold">${step+1} / ${STEPS.length}</p></div>`:''}
        </div>
      </div>
    </div>

    ${!done?html`
      <div class="bg-white border-b border-gray-100 shadow-sm sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 py-3">
          <div class="flex items-center gap-1">
            ${STEPS.map((name,i)=>html`
              <${Fragment} key=${i}>
                <button onClick=${()=>{if(i<=step)setStep(i);}}
                  class=${'step-btn flex items-center gap-1.5 px-2 sm:px-3 py-1.5 rounded-lg text-xs font-medium flex-shrink-0 '+
                    (i===step?'g-bg text-white shadow-md':i<step?'bg-green-100 text-green-700 hover:bg-green-200 cursor-pointer':'bg-gray-100 text-gray-400 cursor-not-allowed')}>
                  <span>${SICONS[i]}</span>
                  <span class="hidden sm:inline">${name}</span>
                  ${i<step?html`<span>✓</span>`:''}
                </button>
                ${i<STEPS.length-1?html`<div class=${'h-0.5 flex-1 rounded '+(i<step?'bg-green-300':'bg-gray-200')}></div>`:''}
              </${Fragment}>
            `)}
          </div>
        </div>
      </div>
    `:''}

    <div class="max-w-5xl mx-auto px-4 py-6">
      ${done
        ? html`<${Summary} mindMap=${mindMap} toc=${toc} style=${styleData} title=${titleData} cover=${coverData} bs=${bsData}/>`
        : html`
          ${step===0&&html`<${BrainStormStep} data=${bsData} onChange=${setBsData} onExtract=${handleBsExtract}/>`}
          ${step===1&&html`<${MindMapStep} data=${mindMap} onChange=${setMindMap} suggestedTopics=${bsData?.selTopics||[]}/>`}
          ${step===2&&html`<${TOCStep} mindMap=${mindMap} data=${toc} onChange=${setTOC}/>`}
          ${step===3&&html`<${StyleStep} data=${styleData} onChange=${setStyleData} toc=${toc}/>`}
          ${step===4&&html`<${TitleStep} mindMap=${mindMap} styleData=${styleData} toc=${toc} data=${titleData} onChange=${setTitleData}/>`}
          ${step===5&&html`<${CoverStep} titleData=${titleData} toc=${toc} data=${coverData} onChange=${setCoverData}/>`}
        `
      }

      <div class="flex items-center justify-between mt-6 pt-4">
        <button onClick=${back} disabled=${!done&&step===0}
          class="flex items-center gap-2 px-5 py-2.5 bg-white border border-gray-200 rounded-xl text-gray-600 font-medium hover:bg-gray-50 disabled:opacity-30 shadow-sm">
          ← 이전
        </button>
        ${!done?html`<p class="text-xs text-gray-400">${SICONS[step]} ${STEPS[step]}</p>`:''}
        <button onClick=${next} disabled=${!canNext()&&!done}
          class=${'flex items-center gap-2 px-5 py-2.5 rounded-xl font-bold shadow-sm transition '+(canNext()||done?'g-btn':'bg-gray-200 text-gray-400 cursor-not-allowed')}>
          ${done?'처음으로 🔄':step===STEPS.length-1?'완성! 🎉':'다음 →'}
        </button>
      </div>

      <!-- 단계별 안내 -->
      ${!done?html`
        <p class="text-center text-xs text-gray-300 mt-3">
          ${step===0?'✏️ 솔직하게 적을수록 더 좋은 주제가 나옵니다':
            step===1?'🗺️ 중심 주제 아래 소주제를 자유롭게 추가하세요':
            step===2?'📋 챕터 제목을 클릭하면 바로 수정할 수 있습니다':
            step===3?'✍️ 책의 톤&매너를 결정하는 중요한 단계입니다':
            step===4?'📝 AI 제목을 선택 후 자유롭게 수정하세요':
            '🎨 색상 피커로 원하는 색을 직접 골라보세요'}
        </p>
      `:''}
    </div>
  </div>`;
}

document.getElementById('root').innerHTML='';
render(html`<${App}/>`, document.getElementById('root'));
</script>
</body>
</html>
